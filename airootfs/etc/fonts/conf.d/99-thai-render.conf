<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Thai Font Rendering Configuration
  Ensures proper Thai vowel positioning: no floating or sinking vowels.

  Key mechanisms:
  1. Prefer NotoSansThai for Thai text - has proper OpenType GPOS tables
  2. HarfBuzz text shaping applies GPOS rules for mark-to-base/mark-to-mark positioning
  3. SARA AM (U+0E33) is decomposed via 'ccmp' feature into NIKHAHIT + SARA AA
  4. Tone marks (U+0E48-U+0E4B) are positioned above the consonant or above vowels
  5. Vowel signs (U+0E34-U+0E37) are positioned correctly above/below the consonant
-->
<fontconfig>

  <!-- Prefer Noto Sans Thai for Thai language text -->
  <!-- Noto Sans Thai has proper OpenType 'ccmp', 'mark', 'mkmk' features -->
  <!-- These ensure tone marks and vowel signs are positioned correctly -->
  <match target="pattern">
    <test compare="contains" name="lang">
      <string>th</string>
    </test>
    <edit mode="prepend" name="family" binding="strong">
      <string>Noto Sans Thai</string>
    </edit>
  </match>

  <!-- Fallback chain for sans-serif with Thai support -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Thai</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Fallback chain for serif with Thai support -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif Thai</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- Fallback chain for monospace with Thai support -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Enable proper font rendering for Thai characters -->
  <match target="font">
    <test compare="contains" name="lang">
      <string>th</string>
    </test>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
    <edit mode="assign" name="embeddedbitmap">
      <bool>false</bool>
    </edit>
  </match>

</fontconfig>
