DEFAULT arch
TIMEOUT 10

LABEL arch
MENU LABEL MAD EL OS (x86_64) - Thai Edition
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisodevice=/dev/disk/by-label/%ARCHISO_LABEL% keymap=th layout=th cow_spacesize=2G

LABEL arch-fallback
MENU LABEL MAD EL OS (x86_64) - Thai Edition (Fallback)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-fallback.img
APPEND archisobasedir=%INSTALL_DIR% archisodevice=/dev/disk/by-label/%ARCHISO_LABEL% keymap=th layout=th cow_spacesize=2G
